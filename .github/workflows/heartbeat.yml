name: Repository heartbeat

on:
  schedule:
    # GitHub Actions cron uses UTC: run at 00:00, 04:00, 08:00, 12:00, 16:00, and 20:00 UTC.
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record heartbeat
        run: |
          mkdir -p .github
          printf '%s | scheduled repository heartbeat\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> .github/activity.log

      - name: Commit heartbeat
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/activity.log
          git diff --cached --quiet || git commit -m "chore: record repository heartbeat"
          git push
